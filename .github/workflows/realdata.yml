name: realdata

# The real-data pipeline matrix (Completion Spec Phase 0.3): every pipeline's recorded config on its real corpus
# file, through batch / headless / session / kernel, against pinned golden masters. Too slow and too heavy (full
# app, Cellpose) for every push, so it runs on a schedule and on demand.
#
# The corpus is not in git. Set the repository variable PYCAT_CORPUS_URL to the release-asset base URL that holds
# the files listed in tests/data/registry.txt (tests/data/fetch.py downloads and SHA-256-verifies them). Without it
# the job says so and stops, instead of reporting a green run that tested nothing.

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  realdata:
    runs-on: ubuntu-latest
    env:
      PYCAT_CORPUS_URL: ${{ vars.PYCAT_CORPUS_URL }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Corpus configured?
        if: ${{ env.PYCAT_CORPUS_URL == '' }}
        run: |
          echo "::warning::PYCAT_CORPUS_URL is not set; the real-data matrix did not run."
          exit 0

      - uses: actions/checkout@v4
        if: ${{ env.PYCAT_CORPUS_URL != '' }}

      - uses: actions/setup-python@v5
        if: ${{ env.PYCAT_CORPUS_URL != '' }}
        with:
          python-version: "3.12"

      - name: Install PyCAT (full app) and the test tools
        if: ${{ env.PYCAT_CORPUS_URL != '' }}
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-qt

      - name: Real-data matrix
        if: ${{ env.PYCAT_CORPUS_URL != '' }}
        run: |
          python -m pytest -m realdata -v
          python tools/route_matrix.py

      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.PYCAT_CORPUS_URL != '' }}
        with:
          name: pipeline-route-matrix
          path: docs/pipeline_route_matrix.md

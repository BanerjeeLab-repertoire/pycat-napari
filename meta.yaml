package:
  name: pycat
  version: "1.0.0"


#source:
  # Assuming the source is from a git repository; replace with your actual source.
#  git_url: https://github.com/yourusername/pycat.git
#  git_rev: v1.0.0

# replace this with the updated version of the above
source:
  path: .
  #git_url: https://github.com/ilanschnell/bsdiff4.git


build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"
  entry_points:
    - run-pycat = pycat.run_pycat:main

  

#build:
#  noarch: python
#  script: python -m pip install .

requirements:
  build:
    - python >=3.12,<3.13
    - setuptools >=42
    - pip
    - wheel
  run:
    # Mirrors [project].dependencies in pyproject.toml (conda-forge names); tests/test_install_routes_agree.py
    # fails when a pyproject dependency is missing here.
    - python >=3.12,<3.13
    # BioIO replaced aicsimageio in 1.6.0 (it is frozen and its pins held numpy<2/zarr<3).
    - bioio >=3.5,<4
    - bioio-ome-tiff >=1.4,<2
    - bioio-tifffile >=1.3,<2
    - bioio-czi >=3.0,<4
    - bioio-imageio >=1.3,<2
    - cellpose <4                  # Cellpose 4 removed the cyto2 CNN
    - matplotlib
    - napari >=0.9.1,<0.10
    - numpy >=1.22
    - opencv
    - pandas
    - pydantic
    - qtpy >=2.4
    - pyside6 >=6.12
    - pytorch                      # [not arm64]
    - pytorch ==2.1.2              # [arm64]
    - torchvision                  # [arm64]
    - pywavelets
    - scikit-image
    - scikit-learn
    - networkx
    - scipy
    - openpyxl
    - largestinteriorrectangle
    - imaris-ims-file-reader
    - av
    - hdf5plugin
    - numba
    - seaborn
    - simpleitk
    - zarr >=2.12

test:
  imports:
    - pycat

about:
  home: https://github.com/cneureuter/pycat
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "Python Condensate Analysis Toolbox"
  description: "PyCAT is a Python Condensate Analysis Toolbox designed for fluorescence image analysis and bio-image analysis, particularly for biomolecular condensates."
  author: "Christian Neureuter"
  author_email: "christian.neureuter@icloud.com"
  #doc_url: "http://myhomepage.com/docs"  # Update with actual URL
  #dev_url: "http://myhomepage.com/dev"  # Update with actual URL
  keywords:
    - condensate
    - image analysis
    - fluorescence image analysis
    - napari
    - PyCAT
  author:
    - name: Christian Neureuter
      email: christian.neureuter@icloud.com

extra:
  recipe-maintainers:
    - cyberdyne_systems
